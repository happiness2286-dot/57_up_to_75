name: Auto Daily XSMB Update & Cloud Push

on:
  schedule:
    # 18:35 PM Vietnam time (UTC+7) = 11:35 AM UTC
    - cron: '35 11 * * *'
    # 18:50 PM Vietnam backup trigger
    - cron: '50 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests beautifulsoup4

      - name: Run Daily XSMB Fetch & Re-Optimization
        run: python update_daily.py

      - name: Commit and Push Cloud Updates
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "auto: Cloud update XSMB & re-optimize Dan 60 So N1 [skip ci]" && git push origin main)
